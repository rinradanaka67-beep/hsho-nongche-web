<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แอดมิน · ฝากไฟล์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --card: #17171b; --field: #222228; --text: #f1ecf7; --muted: #9a8fab;
    --accent: #f7a8cf; --ok: #6ee7b7; --err: #fb7185; --warn: #fbbf24; --line: #2c2c34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Kanit", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; font-weight: 300; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .banner { border-color: var(--warn); color: var(--warn); font-size: 14px; line-height: 1.6; }
  .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 28px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }
  .drop b { color: var(--accent); font-weight: 500; }
  button { font: inherit; font-size: 14px; border: 0; border-radius: 12px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: #1a1220; font-weight: 500; }
  button.ghost { background: var(--field); color: var(--text); }
  button.link { background: transparent; color: var(--accent); padding: 6px 8px; }
  button.danger { background: transparent; color: var(--err); padding: 6px 8px; }
  .uploads { margin-top: 12px; display: grid; gap: 8px; }
  .up { background: var(--field); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .up.err { color: var(--err); } .up.ok { color: var(--ok); }
  input.search { width: 100%; background: var(--field); border: 1px solid transparent; border-radius: 12px; color: var(--text); font: inherit; font-size: 15px; padding: 10px 12px; outline: none; margin-bottom: 12px; }
  input.search:focus { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  td.num { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.acts { white-space: nowrap; text-align: right; }
  .tag { display: inline-block; background: #3a1d24; color: var(--err); border-radius: 8px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; font-weight: 300; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ฝากไฟล์</h1>
      <div class="sub" id="summary">กำลังโหลด…</div>
    </div>
    <button class="ghost" id="logout">ออกจากระบบ</button>
  </header>

  <div class="card banner" id="warn" hidden>
    ⚠️ เซิร์ฟเวอร์นี้ดูเหมือนรันบน Render โดยยังไม่ได้ตั้งค่า <b>DATA_DIR</b> ไฟล์ที่ฝากไว้อาจหายตอน deploy ใหม่หรือรีสตาร์ท
    ให้แนบ Persistent Disk แล้วตั้ง DATA_DIR ให้ชี้ไปที่ดิสก์นั้น
  </div>

  <div class="card">
    <div class="drop" id="drop">ลากไฟล์มาวางที่นี่ หรือ <b>คลิกเพื่อเลือกไฟล์</b><br><span class="sub" id="limit"></span></div>
    <input type="file" id="picker" multiple hidden>
    <div class="uploads" id="uploads"></div>
  </div>

  <div class="card">
    <input class="search" id="search" placeholder="ค้นหาชื่อไฟล์">
    <table>
      <thead><tr><th>ไฟล์</th><th class="hide-sm">ขนาด</th><th class="hide-sm">วันที่ฝาก</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let files = [];

  const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
  const fmtDate = (s) => new Date(s).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  const linkOf = (f) => location.origin + '/f/' + f.id;

  async function load() {
    const res = await fetch('/api/files');
    if (res.status === 401) { location.href = '/login'; return; }
    const d = await res.json();
    files = d.files;
    $('limit').textContent = 'ขนาดสูงสุดต่อไฟล์ ' + d.maxMb + ' MB · ไฟล์ที่ฝากแล้วแก้ไขหรือเขียนทับไม่ได้';
    $('warn').hidden = !d.maybeEphemeral;
    render();
  }

  function cell(text, cls) { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; return td; }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = files.filter(f => !q || f.name.toLowerCase().includes(q)).sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
    const tb = $('rows'); tb.replaceChildren();
    for (const f of list) {
      const tr = document.createElement('tr');
      const name = document.createElement('td'); name.textContent = f.name;
      if (f.missing) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'ไฟล์หาย'; name.append(t); }
      tr.append(name, cell(fmtSize(f.size), 'num hide-sm'), cell(fmtDate(f.uploadedAt), 'num hide-sm'));
      const act = document.createElement('td'); act.className = 'acts';
      if (!f.missing) {
        const dl = document.createElement('a'); dl.href = '/f/' + f.id;
        const b1 = document.createElement('button'); b1.className = 'link'; b1.textContent = 'ดาวน์โหลด'; dl.append(b1);
        const b2 = document.createElement('button'); b2.className = 'link'; b2.textContent = 'คัดลอกลิงก์';
        b2.onclick = async () => { try { await navigator.clipboard.writeText(linkOf(f)); b2.textContent = 'คัดลอกแล้ว ✓'; } catch { prompt('คัดลอกลิงก์นี้', linkOf(f)); } setTimeout(() => b2.textContent = 'คัดลอกลิงก์', 1500); };
        act.append(dl, b2);
      }
      const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'ลบ'; del.onclick = () => remove(f);
      act.append(del); tr.append(act); tb.append(tr);
    }
    const total = files.reduce((s, f) => s + f.size, 0);
    $('summary').textContent = 'ทั้งหมด ' + files.length + ' ไฟล์ · ' + fmtSize(total);
    $('empty').hidden = list.length > 0;
    $('empty').textContent = files.length ? 'ไม่พบไฟล์ที่ค้นหา' : 'ยังไม่มีไฟล์ที่ฝากไว้';
  }

  async function remove(f) {
    if (!confirm('ลบ "' + f.name + '" ถาวร? ลิงก์ที่แชร์ไปแล้วจะใช้ไม่ได้อีก')) return;
    const res = await fetch('/api/files/' + f.id, { method: 'DELETE' });
    if (res.status === 401) { location.href = '/login'; return; }
    const d = await res.json().catch(() => ({}));
    if (!res.ok) return alert(d.error || 'ลบไม่สำเร็จ');
    files = files.filter(x => x.id !== f.id); render();
  }

  function upload(file) {
    const box = document.createElement('div'); box.className = 'up';
    const label = document.createElement('div'); label.textContent = file.name + ' (' + fmtSize(file.size) + ')';
    const bar = document.createElement('div'); bar.className = 'bar'; const fill = document.createElement('i'); bar.append(fill);
    box.append(label, bar); $('uploads').prepend(box);
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/files');
      xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
      xhr.setRequestHeader('X-Filetype', file.type || '');
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; };
      xhr.onload = () => {
        let d = {}; try { d = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 401) { location.href = '/login'; return; }
        if (xhr.status === 201 && d.success) { box.className = 'up ok'; label.textContent = '✅ ' + file.name + ' ฝากสำเร็จ'; bar.remove(); files.push(d.file); render(); }
        else { box.className = 'up err'; label.textContent = '❌ ' + file.name + ' — ' + (d.error || 'อัปโหลดไม่สำเร็จ'); bar.remove(); }
        resolve();
      };
      xhr.onerror = () => { box.className = 'up err'; label.textContent = '❌ ' + file.name + ' — เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; bar.remove(); resolve(); };
      xhr.send(file);
    });
  }

  async function uploadAll(list) { for (const f of list) await upload(f); }

  const drop = $('drop');
  drop.onclick = () => $('picker').click();
  $('picker').onchange = (e) => { uploadAll([...e.target.files]); e.target.value = ''; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadAll([...e.dataTransfer.files]); };
  $('search').addEventListener('input', render);
  $('logout').onclick = () => fetch('/api/admin/logout', { method: 'POST' }).then(() => location.href = '/login');

  load().catch(() => { $('summary').textContent = 'โหลดรายการไม่สำเร็จ'; });
</script>
</body>
</html>
